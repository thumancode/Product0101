name: Render video

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "ফাইলগুলো কোথায় আছে? মূল ফোল্ডারে থাকলে . (ডট) রাখুন, নাহলে ফোল্ডারের নাম লিখুন"
        required: true
        default: "."
      quality:
        description: "full = পূর্ণ মান, preview = দ্রুত ছোট প্রিভিউ"
        type: choice
        default: full
        options:
          - full
          - preview

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools (ffmpeg, fonts, browser)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install playwright numpy scipy pillow
          python -m playwright install --with-deps chromium

      - name: Render video
        env:
          FOLDER: ${{ inputs.folder }}
          QUALITY: ${{ inputs.quality }}
        run: |
          case "$FOLDER" in *..*|/*) echo "Invalid folder"; exit 1;; esac
          EXTRA=""
          if [ "$QUALITY" = "preview" ]; then EXTRA="--scale 0.5"; fi
          python make_video.py "$FOLDER" --out "out/video-${{ github.run_number }}.mp4" --workers "$(nproc)" $EXTRA

      - name: Save video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: out/*.mp4
          retention-days: 30

      - name: Publish to Releases (easy download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "video-${{ github.run_number }}" out/*.mp4 \
            --title "Video #${{ github.run_number }}" \
            --notes "Rendered by GitHub Actions (quality: ${{ inputs.quality }})."
